<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>大会スケジュール帳</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- 日本語フォント（Noto Sans JP）と手書き風（Zen Kurenaido） -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Zen+Kurenaido&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* モノトーン基調 */
            --bg-desk: #f2f2f7;
            --paper: #ffffff;
            --ink: #1c1c1e;
            --ink-light: #8e8e93;
            --grid: #e5e5ea;
            
            /* アクセント：蛍光ペン */
            --highlighter: rgba(255, 235, 59, 0.7);

            /* サイズ */
            --radius: 24px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            touch-action: pan-y; 
        }

        body {
            font-family: 'Noto Sans JP', sans-serif; /* 日本語フォント優先 */
            background-color: var(--bg-desk);
            color: var(--ink);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .scene {
            width: 100%;
            max-width: 430px;
            height: 100%;
            max-height: 900px;
            perspective: 1500px;
            position: relative;
            padding: 10px;
            display: flex;
            flex-direction: column;
        }

        .notebook {
            flex: 1;
            position: relative;
            transform-style: preserve-3d;
            margin-bottom: 20px;
        }

        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--paper);
            border-radius: var(--radius);
            box-shadow: 
                0 10px 30px rgba(0,0,0,0.08), 
                0 1px 3px rgba(0,0,0,0.05);
            background-image: radial-gradient(var(--grid) 1.5px, transparent 1.5px);
            background-size: 20px 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transform-origin: left center;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            backface-visibility: hidden;
        }

        .page-day2 {
            z-index: 4;
            transform: rotateY(0deg);
        }
        
        .page-day1 {
            z-index: 5;
        }

        .page-day1.flipped {
            transform: rotateY(-110deg);
        }

        .content-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 20px 25px 80px;
            overscroll-behavior-y: contain;
        }

        header {
            padding: 30px 25px 15px;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--grid);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .date-display {
            font-size: 2.8rem; /* 日本語に合わせて少し調整 */
            font-weight: 900;
            line-height: 1;
            letter-spacing: -0.02em;
            color: var(--ink);
            margin-bottom: 8px;
        }

        .date-sub {
            font-size: 0.9rem;
            color: var(--ink-light);
            font-weight: 700;
            display: flex;
            justify-content: space-between;
        }

        .timeline-list {
            position: relative;
        }
        .timeline-list::before {
            content: '';
            position: absolute;
            left: 58px;
            top: 10px;
            bottom: 10px;
            width: 2px;
            background: var(--grid);
        }

        .schedule-row {
            display: flex;
            margin-bottom: 30px;
            position: relative;
            align-items: flex-start;
        }

        .time-col {
            width: 58px;
            font-size: 1rem; /* 数字を見やすく */
            font-weight: 700; /* 数字は太く */
            color: var(--ink-light);
            padding-top: 2px;
            text-align: left;
            font-feature-settings: "tnum"; /* 等幅数字 */
            font-family: 'Helvetica Neue', Arial, sans-serif; /* 数字は欧文フォントで */
            transition: all 0.3s;
        }

        .info-col {
            flex: 1;
            padding-left: 20px;
            position: relative;
        }

        .event-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 6px;
            line-height: 1.4;
            position: relative;
            display: inline-block;
            z-index: 1;
            color: #333;
        }

        .event-place {
            font-size: 0.9rem;
            color: var(--ink-light);
            font-family: 'Zen Kurenaido', sans-serif;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* 蛍光ペン演出 */
        .schedule-row.current .event-title::before {
            content: '';
            position: absolute;
            top: 60%;
            left: -5px;
            width: 0%;
            height: 12px;
            background: var(--highlighter);
            transform: translateY(-50%);
            z-index: -1;
            border-radius: 2px;
            animation: highlightLine 0.8s 0.3s cubic-bezier(0.2, 1, 0.3, 1) forwards;
        }
        
        @keyframes highlightLine { to { width: 105%; } }

        .schedule-row.current .time-col {
            color: var(--ink);
            font-weight: 900;
            transform: scale(1.1);
        }
        
        .schedule-row.current .event-title::after {
            content: 'NOW';
            position: absolute;
            right: -55px;
            top: 2px;
            font-size: 0.7rem;
            font-weight: 900;
            color: var(--ink);
            background: #fff;
            border: 2px solid var(--ink);
            padding: 1px 6px;
            border-radius: 10px;
            transform: rotate(10deg);
            box-shadow: 2px 2px 0 rgba(0,0,0,0.1);
        }

        .schedule-row.finished { opacity: 0.4; }
        .schedule-row.finished .event-title { 
            text-decoration: line-through; 
            text-decoration-color: var(--ink-light);
            text-decoration-thickness: 1.5px;
        }

        .binder-rings {
            position: absolute;
            left: -10px;
            top: 0;
            bottom: 0;
            width: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            z-index: 20;
            pointer-events: none;
        }
        .ring {
            width: 30px;
            height: 12px;
            background: linear-gradient(to bottom, #ccc, #fff, #999);
            border-radius: 6px;
            box-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 10px 0 20px;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ccc;
            transition: all 0.3s;
        }
        .dot.active {
            background: var(--ink);
            transform: scale(1.3);
        }

        .swipe-hint {
            text-align: center;
            font-size: 0.85rem;
            color: var(--ink-light);
            opacity: 0.7;
            margin-top: -10px;
            margin-bottom: 10px;
            font-family: 'Zen Kurenaido', sans-serif;
            font-weight: 600;
        }

    </style>
</head>
<body>

<div class="scene">
    <div class="swipe-hint">← スワイプしてめくる →</div>

    <div class="notebook" id="notebook">
        <!-- リング -->
        <div class="binder-rings">
            <div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="ring"></div>
            <div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="ring"></div>
        </div>

        <!-- 2日目 (奥) -->
        <div class="page page-day2" id="page2">
            <header>
                <div class="date-display">2日目</div>
                <div class="date-sub">
                    <span>1月25日 (日)</span>
                    <span>可児大会</span>
                </div>
            </header>
            <div class="content-scroll">
                <div class="timeline-list" id="list-day2"></div>
            </div>
        </div>

        <!-- 1日目 (手前) -->
        <div class="page page-day1" id="page1">
            <header>
                <div class="date-display">1日目</div>
                <div class="date-sub">
                    <span>1月24日 (土)</span>
                    <span>岐阜県連大会</span>
                </div>
            </header>
            <div class="content-scroll">
                <div class="timeline-list" id="list-day1"></div>
            </div>
        </div>
    </div>

    <!-- ページネーション -->
    <div class="pagination">
        <div class="dot active" id="dot1"></div>
        <div class="dot" id="dot2"></div>
    </div>
</div>

<script>
    const schedule = {
        1: [
            { time: "09:00", title: "受付開始", place: "エントランスホール" },
            { time: "10:00", title: "開会式", place: "メインホール" },
            { time: "10:30", title: "基調講演", place: "メインホール" },
            { time: "12:00", title: "昼食休憩", place: "ロビー・芝生広場" },
            { time: "13:30", title: "分科会 A/B/C", place: "会議室 201-203" },
            { time: "16:00", title: "全体会", place: "メインホール" },
            { time: "18:00", title: "交流会", place: "別館バンケット" }
        ],
        2: [
            { time: "09:00", title: "受付", place: "エントランス" },
            { time: "09:30", title: "分科会発表", place: "メインホール" },
            { time: "11:30", title: "閉会式", place: "メインホール" },
            { time: "12:00", title: "解散", place: "お気をつけて" }
        ]
    };

    // 初期化
    document.addEventListener('DOMContentLoaded', () => {
        renderList(1);
        renderList(2);
        checkTime();
        setInterval(checkTime, 60000);
        setupSwipe();
    });

    // リスト描画
    function renderList(day) {
        const container = document.getElementById(`list-day${day}`);
        let html = '';
        schedule[day].forEach(item => {
            html += `
                <div class="schedule-row" data-time="${item.time}">
                    <div class="time-col">${item.time}</div>
                    <div class="info-col">
                        <div class="event-title">${item.title}</div>
                        <div class="event-place">📍 ${item.place}</div>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    // 時間チェック
    function checkTime() {
        const now = new Date();
        const currentMins = now.getHours() * 60 + now.getMinutes();
        
        [1, 2].forEach(day => {
            const rows = document.querySelectorAll(`#list-day${day} .schedule-row`);
            rows.forEach((row, index) => {
                const timeStr = row.dataset.time;
                const [h, m] = timeStr.split(':').map(Number);
                const itemMins = h * 60 + m;
                
                let nextMins = 24 * 60;
                if (index < rows.length - 1) {
                    const nextTimeStr = rows[index + 1].dataset.time;
                    const [nh, nm] = nextTimeStr.split(':').map(Number);
                    nextMins = nh * 60 + nm;
                }

                row.classList.remove('current', 'finished');
                if (currentMins >= nextMins) {
                    row.classList.add('finished');
                } else if (currentMins >= itemMins && currentMins < nextMins) {
                    row.classList.add('current');
                }
            });
        });
    }

    // スワイプ処理
    function setupSwipe() {
        const notebook = document.getElementById('notebook');
        let startX = 0;
        let startY = 0;
        let isSwiping = false;

        notebook.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
            isSwiping = true;
        }, { passive: true });

        notebook.addEventListener('touchend', (e) => {
            if (!isSwiping) return;
            
            const endX = e.changedTouches[0].clientX;
            const endY = e.changedTouches[0].clientY;
            
            const diffX = startX - endX;
            const diffY = startY - endY;

            // 横移動がメインの場合のみ
            if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 50) {
                if (diffX > 0) {
                    flipPage(2);
                } else {
                    flipPage(1);
                }
            }
            isSwiping = false;
        });
    }

    function flipPage(targetDay) {
        const page1 = document.getElementById('page1');
        const dot1 = document.getElementById('dot1');
        const dot2 = document.getElementById('dot2');

        if (targetDay === 2) {
            page1.classList.add('flipped');
            dot1.classList.remove('active');
            dot2.classList.add('active');
        } else {
            page1.classList.remove('flipped');
            dot2.classList.remove('active');
            dot1.classList.add('active');
        }
    }
</script>

</body>
</html>
